name: CI

# Pemeriksaan kualitas untuk setiap PR dan push ke main.
# Deploy dilakukan otomatis oleh Cloudflare Workers Builds (terhubung ke repo ini).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Cache hasil optimasi gambar Astro agar build tetap cepat walau foto di repo bertambah.
      - uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-assets-${{ hashFiles('src/assets/**') }}
          restore-keys: astro-assets-

      - name: Format
        run: npm run format:check

      - name: Type check (situs + Worker)
        run: npm run check

      - name: Unit test (Worker)
        run: npm test

      - name: Build + verifikasi URL lama + audit SEO
        run: npm run build
